<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#050505"><title>The Wizard's Castle</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--fg:#f1f1e8;--dim:#aaa99f;--bg:#050505;--line:#373737;--key:#171717}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);height:100%;font-family:"Courier New",Courier,monospace}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:1000px;margin:auto;min-height:100%;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
#screen{white-space:pre-wrap;overflow:auto;flex:1;padding:18px 16px;font-size:clamp(15px,2.2vw,21px);line-height:1.25;min-height:45vh}
.prompt{display:flex;padding:8px 14px;border-top:1px solid var(--line);gap:8px;align-items:center}
#cmd{flex:1;background:#090909;color:var(--fg);border:1px solid #555;border-radius:5px;padding:12px;font:inherit;font-size:18px}
button{font-family:inherit;color:var(--fg);background:var(--key);border:1px solid #555;border-radius:7px;min-height:48px;font-size:17px}
#controls{padding:10px 12px 16px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;border-top:1px solid var(--line)}
.wide{grid-column:span 2}.move{font-weight:bold;font-size:21px}.tiny{font-size:13px;color:var(--dim)}
@media(max-width:600px){#controls{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 2}header{font-size:12px}}
</style></head>
<body><div id="app">
<header><span>THE WIZARD'S CASTLE</span><span id="status">NO GAME</span></header>
<div id="screen"></div>
<div class="prompt"><span>&gt;</span><input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Command"><button id="enter">ENTER</button></div>
<div id="controls">
<button data-cmd="N" class="move">N</button><button data-cmd="S" class="move">S</button><button data-cmd="E" class="move">E</button><button data-cmd="W" class="move">W</button>
<button data-cmd="U">UP</button><button data-cmd="D">DOWN</button><button data-cmd="M">MAP</button><button data-cmd="I">INV</button>
<button data-cmd="F">FLARE</button><button data-cmd="L">LAMP</button><button data-cmd="O">OPEN</button><button data-cmd="G">GAZE</button>
<button data-cmd="A">ATTACK</button><button data-cmd="R">READ</button><button data-cmd="DR">DRINK</button><button data-cmd="T">TELEPORT</button>
<button data-cmd="H" class="wide">HELP</button><button data-cmd="SAVE" class="wide">SAVE</button>
<button data-cmd="NEW" class="wide">NEW GAME</button><button data-cmd="LOAD" class="wide">RESUME</button>
</div></div>
<script>
"use strict";
const $=s=>document.querySelector(s), screen=$("#screen"), status=$("#status"), input=$("#cmd");
const R=n=>Math.floor(Math.random()*n), roll=n=>R(n)+1, clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const monsterNames=["KOBOLD","ORC","WOLF","GOBLIN","OGRE","TROLL","BEAR","MINOTAUR","GARGOYLE","CHIMERA","BALROG","DRAGON"];
const treasureNames=["RUBY RED","NORN STONE","PALE PEARL","OPAL EYE","GREEN GEM","BLUE FLAME","PALINTIR","SILMARIL"];
let G=null, mode="title";

function out(s=""){screen.textContent+=s+"\n";screen.scrollTop=screen.scrollHeight}
function clear(){screen.textContent=""}
function intro(){clear();out("************************************");out("");out("      * * * THE WIZARD'S CASTLE * * *");out("");out("************************************");out("");
out("MANY CYCLES AGO, IN THE KINGDOM OF N'DIC,");out("THE GNOMIC WIZARD ZOT FORGED HIS GREAT");out("*ORB OF POWER*. HE VANISHED, LEAVING HIS");out("VAST SUBTERRANEAN CASTLE, ITS TREASURES,");out("MONSTERS, AND THE INCREDIBLE ORB OF ZOT.");out("");out("ALL RIGHT, BOLD ONE.");out("");out("TYPE NEW TO BEGIN, OR LOAD TO RESUME.");}

function blankDungeon(){return Array.from({length:8},()=>Array.from({length:8},()=>Array.from({length:8},()=>({c:".",seen:false,monster:0,staff:false,orb:false,curse:0,treasure:-1}))))}
function room(x,y,z){return G.d[z][y][x]}
function emptyOn(z){let a=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(room(x,y,z).c===".")a.push([x,y]);return a}
function place(z,c,extra={}){let a=emptyOn(z); if(!a.length)return null;let [x,y]=a[R(a.length)];Object.assign(room(x,y,z),{c,...extra});return [x,y]}
function generate(){
 G={d:blankDungeon(),x:3,y:0,z:0,turn:0,race:"",sex:"",st:8,dx:8,iq:8,gp:60,hp:20,maxhp:20,
 weapon:0,armor:0,dur:0,lamp:false,flares:0,staff:false,orb:false,treasures:[],curses:[false,false,false],blind:false,book:false,lastDir:"N"};
 room(3,0,0).c="E";room(3,0,0).seen=true;
 for(let z=0;z<7;z++){for(let k=0;k<2;k++){let p=place(z,"D"); if(p){let [x,y]=p;room(x,y,z+1).c="U"}}}
 for(let z=0;z<8;z++){for(let m=1;m<=12;m++)place(z,"M",{monster:m});for(let k=0;k<3;k++)["P","C","G","F","W","S","O","B"].forEach(c=>place(z,c));for(let k=0;k<3;k++)place(z,"V")}
 treasureNames.forEach((_,i)=>place(R(8),"T",{treasure:i}));
 for(let q=1;q<=3;q++){let z=R(8),p=place(z,".",{curse:q});}
 let sz=R(8), sm=R(12)+1; place(sz,"M",{monster:sm,staff:true});
 let oz=R(8);place(oz,"W",{orb:true});
 return G;
}
function newGame(){generate();mode="race";clear();out("YOU MAY BE AN ELF, DWARF, MAN, OR HOBBIT.");out("");out("YOUR CHOICE?  (E/D/M/H)");update()}
function racePick(c){let map={H:["HOBBIT",4,12,8,4],E:["ELF",6,10,8,8],M:["MAN",8,8,8,8],D:["DWARF",10,6,8,8]};let a=map[c];if(!a){out("PLEASE CHOOSE E, D, M, OR H.");return} [G.race,G.st,G.dx,G.iq,G.points]=a;G.hp=G.maxhp=G.st*2+8;mode="points";out("");out(`A ${G.race}. ST ${G.st}, DX ${G.dx}, IQ ${G.iq}.`);out(`YOU HAVE ${G.points} EXTRA POINTS.`);out("ENTER THREE NUMBERS FOR ST DX IQ, E.G. 3 2 3");}
function pointsPick(s){let a=s.trim().split(/\s+/).map(Number);if(a.length!==3||a.some(Number.isNaN)||a.some(n=>n<0)||a.reduce((x,y)=>x+y,0)!==G.points){out(`ALLOCATE EXACTLY ${G.points} POINTS.`);return}G.st+=a[0];G.dx+=a[1];G.iq+=a[2];G.maxhp=G.hp=G.st*2+8;mode="shop";out("");out("YOU HAVE 60 GOLD PIECES.");out("BUY ONE: DAGGER 10, MACE 20, SWORD 30.");out("TYPE DAGGER, MACE, OR SWORD.");}
function shop(s){s=s.toUpperCase();let m={DAGGER:[1,10],MACE:[2,20],SWORD:[3,30]};if(!m[s]){out("DAGGER, MACE, OR SWORD?");return}G.weapon=m[s][0];G.gp-=m[s][1];let afford=G.gp;G.armor=afford>=30?3:afford>=20?2:afford>=10?1:0;let cost=G.armor*10;G.gp-=cost;G.dur=G.armor*7;if(G.gp>=20){G.lamp=true;G.gp-=20}G.flares=G.gp;G.gp=0;mode="play";out("");out("YOUR REMAINING GOLD OUTFITS YOU AUTOMATICALLY.");out(`ARMOR: ${["NONE","LEATHER","CHAINMAIL","PLATE"][G.armor]}. LAMP: ${G.lamp?"YES":"NO"}. FLARES: ${G.flares}.`);out("");out("YOU ENTER THE CASTLE.");describe();save()}
function update(){if(!G){status.textContent="NO GAME";return}status.textContent=`L${G.z+1}  ST:${G.st} DX:${G.dx} IQ:${G.iq} GP:${G.gp} HP:${G.hp}`}
function map(){out("");out(`MAP - LEVEL ${G.z+1}`);out("  1 2 3 4 5 6 7 8");for(let y=0;y<8;y++){let line=(y+1)+" ";for(let x=0;x<8;x++){let r=room(x,y,G.z),c=r.seen?r.c:"?";if(x===G.x&&y===G.y)c="@";line+=c+" "}out(line)}out("")}
function describe(){
 let r=room(G.x,G.y,G.z);r.seen=true;out(`YOU ARE AT (${G.x+1},${G.y+1}) ON LEVEL ${G.z+1}.`);
 if(r.c==="M")out(`A ${monsterNames[r.monster-1]} IS HERE.`);
 else if(r.c==="V")out("A VENDOR EYES YOUR PURSE.");
 else {let d={E:"THE CASTLE ENTRANCE IS HERE.",D:"STAIRS LEAD DOWN.",U:"STAIRS LEAD UP.",P:"A STRANGE POOL SHIMMERS HERE.",C:"A CHEST RESTS HERE.",G:"GOLD GLITTERS ON THE FLOOR.",F:"YOU FIND FLARES.",W:"A WARP HUMS HERE.",S:"A SINKHOLE YAWNS HERE.",O:"A CRYSTAL ORB RESTS HERE.",B:"AN ANCIENT BOOK LIES HERE.",T:"A FABULOUS TREASURE IS HERE.",".":"THE ROOM IS EMPTY."};out(d[r.c]||"")}
 resolvePassive(r);update()
}
function resolvePassive(r){
 if(r.c==="G"){let n=roll(10);G.gp+=n;r.c=".";out(`YOU PICK UP ${n} GOLD PIECES.`)}
 if(r.c==="F"){let n=roll(5);G.flares+=n;r.c=".";out(`YOU FIND ${n} FLARES.`)}
 if(r.c==="T"){let n=r.treasure;G.treasures.push(n);r.c=".";out(`YOU HAVE FOUND THE ${treasureNames[n]}!`)}
 if(r.c==="S"){out("YOU FALL THROUGH THE SINKHOLE!");G.z=(G.z+1)%8;describe()}
 if(r.c==="W"&&!r.orb){out("THE WARP TAKES YOU!");G.x=R(8);G.y=R(8);G.z=R(8);describe()}
 if(r.curse){G.curses[r.curse-1]=true;out(["","YOU FEEL A TERRIBLE LETHARGY.","A LEECHING CURSE CLINGS TO YOU.","A FOG OF FORGETFULNESS CLOUDS YOUR MIND."][r.curse])}
}
function tick(){G.turn++;if(G.curses[1]&&!G.treasures.includes(2))G.gp=Math.max(0,G.gp-roll(5));if(G.curses[2]&&!G.treasures.includes(4)){let z=R(8),x=R(8),y=R(8);room(x,y,z).seen=false}}
function move(dx,dy,dir){let r=room(G.x,G.y,G.z);if(r.c==="M"){out("THE MONSTER BLOCKS YOUR WAY. ATTACK OR FLEE ANOTHER DIRECTION.");}
 if(G.z===0&&G.x===3&&G.y===0&&dir==="N"){if(G.orb){out("");out("*** YOU EMERGE WITH THE ORB OF ZOT! ***");out(`VICTORY IN ${G.turn} TURNS.`);mode="won";localStorage.removeItem("wcastle-save");return}else{out("YOU CANNOT ABANDON THE QUEST SO EASILY.");return}}
 G.x=(G.x+dx+8)%8;G.y=(G.y+dy+8)%8;G.lastDir=dir;tick();describe();save()
}
function stairs(up){let r=room(G.x,G.y,G.z);if(up&&r.c==="U"){G.z--;tick();describe()}else if(!up&&r.c==="D"){G.z++;tick();describe()}else out("THERE ARE NO STAIRS THAT WAY.");save()}
function attack(){let r=room(G.x,G.y,G.z);if(r.c!=="M"){out("THERE IS NOTHING HERE TO ATTACK.");return}let m=r.monster,hp=m+2;out(`YOU ATTACK THE ${monsterNames[m-1]}!`);while(hp>0&&G.hp>0){let hit=roll(20)+Math.floor(G.dx/3);if(hit>=10+m){let dmg=Math.max(1,G.weapon+roll(Math.max(1,Math.floor(G.st/4))));hp-=dmg;out(`YOU HIT FOR ${dmg}.`)}else out("YOU MISS.");if(hp>0){let dmg=Math.max(0,1+Math.floor(m/2)-G.armor);G.hp-=dmg;G.dur-=Math.min(G.armor,1+Math.floor(m/2));out(`IT HITS YOU FOR ${dmg}.`);if(G.dur<=0&&G.armor){G.armor=0;out("YOUR ARMOR IS DESTROYED!")}}}
 if(G.hp<=0){out("");out("*** YOU HAVE DIED IN THE WIZARD'S CASTLE. ***");mode="dead";localStorage.removeItem("wcastle-save");update();return}
 if(r.staff){G.staff=true;out("THE MONSTER CARRIED THE RUNESTAFF! YOU TAKE IT.")}r.c=".";r.monster=0;r.staff=false;out(`THE ${monsterNames[m-1]} IS SLAIN.`);tick();update();save()}
function flare(){if(G.flares<1){out("YOU HAVE NO FLARES.");return}G.flares--;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)room((G.x+xx+8)%8,(G.y+yy+8)%8,G.z).seen=true;out("THE FLARE REVEALS THE NEARBY ROOMS.");map();tick();save()}
function lamp(){if(!G.lamp){out("YOU HAVE NO LAMP.");return}for(let y=0;y<8;y++)for(let x=0;x<8;x++)room(x,y,G.z).seen=true;out("YOUR LAMP REVEALS THIS LEVEL.");map();tick();save()}
function openThing(){let r=room(G.x,G.y,G.z);if(r.c==="C"){let n=roll(20);G.gp+=n;r.c=".";out(`THE CHEST HOLDS ${n} GOLD PIECES.`);tick();save()}else out("NOTHING HERE OPENS.")}
function drink(){let r=room(G.x,G.y,G.z);if(r.c!=="P"){out("THERE IS NO POOL HERE.");return}let q=R(4);if(q===0){G.st++;out("YOU FEEL STRONGER.")}else if(q===1){G.dx++;out("YOU FEEL QUICKER.")}else if(q===2){G.iq++;out("YOUR MIND CLEARS.")}else{G.hp=Math.min(G.maxhp,G.hp+roll(8));out("YOU FEEL RESTORED.")}tick();update();save()}
function gaze(){let r=room(G.x,G.y,G.z);if(r.c!=="O"){out("THERE IS NO CRYSTAL ORB HERE.");return}let z=R(8);out(`A VISION OF LEVEL ${z+1} APPEARS...`);for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(Math.random()<.18)room(x,y,z).seen=true;tick();save()}
function readBook(){let r=room(G.x,G.y,G.z);if(r.c!=="B"){out("THERE IS NO BOOK HERE.");return}let q=R(3);if(q===0){G.iq++;out("THE BOOK TEACHES YOU AN ANCIENT SECRET.")}else if(q===1){G.book=true;out("THE BOOK STICKS TO YOUR HANDS!")}else out("THE PAGES CRUMBLE INTO DUST.");r.c=".";tick();save()}
function teleport(arg){if(!G.staff){out("YOU DO NOT HAVE THE RUNESTAFF.");return}let a=(arg||"").match(/(\d+)\D+(\d+)\D+(\d+)/);if(!a){out("TYPE: T X Y LEVEL   (VALUES 1-8)");return}let x=+a[1]-1,y=+a[2]-1,z=+a[3]-1;if([x,y,z].some(v=>v<0||v>7)){out("COORDINATES MUST BE 1 THROUGH 8.");return}G.x=x;G.y=y;G.z=z;let r=room(x,y,z);if(r.orb){G.orb=true;G.staff=false;r.orb=false;r.c=".";out("*** THE RUNESTAFF VANISHES! YOU HAVE THE ORB OF ZOT! ***")}else out("THE RUNESTAFF BENDS SPACE AROUND YOU.");tick();describe();save()}
function inventory(){out(`RACE: ${G.race}   ST:${G.st} DX:${G.dx} IQ:${G.iq} HP:${G.hp}`);out(`WEAPON: ${["NONE","DAGGER","MACE","SWORD"][G.weapon]}  ARMOR: ${["NONE","LEATHER","CHAINMAIL","PLATE"][G.armor]}`);out(`GP:${G.gp} FLARES:${G.flares} LAMP:${G.lamp?"YES":"NO"} RUNESTAFF:${G.staff?"YES":"NO"} ORB:${G.orb?"YES":"NO"}`);if(G.treasures.length)out("TREASURES: "+G.treasures.map(i=>treasureNames[i]).join(", "))}
function help(){out("COMMANDS: N S E W, U/P, D/OWN, M/AP, I/NVENTORY,");out("A/TTACK, F/LARE, L/AMP, O/PEN, R/EAD, G/AZE, DR/INK,");out("T X Y LEVEL (TELEPORT WITH RUNESTAFF), SAVE, LOAD, NEW.");}
function save(){if(G&&mode==="play")localStorage.setItem("wcastle-save",JSON.stringify({G,mode}));update()}
function load(){let s=localStorage.getItem("wcastle-save");if(!s){out("NO SAVED GAME.");return}let o=JSON.parse(s);G=o.G;mode="play";clear();out("SAVED GAME RESTORED.");describe()}
function command(raw){
 let s=raw.trim().toUpperCase();if(!s)return;
 if(s==="NEW"){newGame();return} if(s==="LOAD"){load();return}
 if(mode==="race"){racePick(s[0]);return}if(mode==="points"){pointsPick(s);return}if(mode==="shop"){shop(s);return}
 if(mode!=="play"){out("TYPE NEW TO START A NEW GAME.");return}
 let c=s.split(/\s+/)[0];
 if(c==="N"||c==="NORTH")move(0,-1,"N");else if(c==="S"||c==="SOUTH")move(0,1,"S");else if(c==="E"||c==="EAST")move(1,0,"E");else if(c==="W"||c==="WEST")move(-1,0,"W");
 else if(c==="U"||c==="UP")stairs(true);else if(c==="D"||c==="DOWN")stairs(false);else if(c==="M"||c==="MAP")map();else if(c==="I"||c==="INVENTORY")inventory();
 else if(c==="A"||c==="ATTACK")attack();else if(c==="F"||c==="FLARE")flare();else if(c==="L"||c==="LAMP")lamp();else if(c==="O"||c==="OPEN")openThing();
 else if(c==="R"||c==="READ")readBook();else if(c==="G"||c==="GAZE")gaze();else if(c==="DR"||c==="DRINK")drink();else if(c==="T"||c==="TELEPORT")teleport(s.slice(c.length).trim());
 else if(c==="H"||c==="HELP"||c==="?")help();else if(c==="SAVE"){save();out("GAME SAVED.")}else out("I DON'T UNDERSTAND THAT COMMAND.");
 update()
}
$("#enter").onclick=()=>{let v=input.value;input.value="";command(v);input.focus()}
input.addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()})
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>command(b.dataset.cmd))
intro();update();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#050505"><title>The Wizard's Castle</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--fg:#f1f1e8;--dim:#aaa99f;--bg:#050505;--line:#373737;--key:#171717}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);height:100%;font-family:"Courier New",Courier,monospace}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:1000px;margin:auto;min-height:100%;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
#screen{white-space:pre-wrap;overflow:auto;flex:1;padding:18px 16px;font-size:clamp(15px,2.2vw,21px);line-height:1.25;min-height:45vh}
.prompt{display:flex;padding:8px 14px;border-top:1px solid var(--line);gap:8px;align-items:center}
#cmd{flex:1;background:#090909;color:var(--fg);border:1px solid #555;border-radius:5px;padding:12px;font:inherit;font-size:18px}
button{font-family:inherit;color:var(--fg);background:var(--key);border:1px solid #555;border-radius:7px;min-height:48px;font-size:17px}
#context{display:none;padding:8px 12px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;border-top:1px solid var(--line)}
#context.active{display:grid}
#context button{min-height:44px;font-size:15px}
#controls{padding:10px 12px 16px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;border-top:1px solid var(--line)}
.wide{grid-column:span 2}.move{font-weight:bold;font-size:21px}.tiny{font-size:13px;color:var(--dim)}
@media(max-width:600px){#controls{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 2}header{font-size:12px}}
</style></head>
<body><div id="app">
<header><span>THE WIZARD'S CASTLE</span><span id="status">NO GAME</span></header>
<div id="screen"></div>
<div class="prompt"><span>&gt;</span><input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Command"><button id="enter">ENTER</button></div>
<div id="context"></div>
<div id="controls">
<button data-cmd="N" class="move">N</button><button data-cmd="S" class="move">S</button><button data-cmd="E" class="move">E</button><button data-cmd="W" class="move">W</button>
<button data-cmd="U">UP</button><button data-cmd="D">DOWN</button><button data-cmd="M">MAP</button><button data-cmd="I">INV</button>
<button data-cmd="F">FLARE</button><button data-cmd="L">LAMP</button><button data-cmd="O">OPEN</button><button data-cmd="G">GAZE</button>
<button data-cmd="A">ATTACK</button><button data-cmd="R">READ</button><button data-cmd="DR">DRINK</button><button data-cmd="T">TELEPORT</button>
<button data-cmd="H" class="wide">HELP</button><button data-cmd="SAVE" class="wide">SAVE</button>
<button data-cmd="NEW" class="wide">NEW GAME</button><button data-cmd="LOAD" class="wide">RESUME</button>
</div></div>
<script>
"use strict";
const $=s=>document.querySelector(s), screen=$("#screen"), status=$("#status"), input=$("#cmd");
const R=n=>Math.floor(Math.random()*n), roll=n=>R(n)+1, clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const monsterNames=["KOBOLD","ORC","WOLF","GOBLIN","OGRE","TROLL","BEAR","MINOTAUR","GARGOYLE","CHIMERA","BALROG","DRAGON"];
const treasureNames=["RUBY RED","NORN STONE","PALE PEARL","OPAL EYE","GREEN GEM","BLUE FLAME","PALINTIR","SILMARIL"];
let G=null, mode="title";

function out(s=""){screen.textContent+=s+"\n";screen.scrollTop=screen.scrollHeight}
function clear(){screen.textContent=""}
function contextChoices(a=[]){let x=$("#context");x.innerHTML="";a.forEach(v=>{let b=document.createElement("button");b.type="button";b.textContent=v[0];b.onclick=()=>command(v[1]);x.appendChild(b)});x.classList.toggle("active",a.length>0)}
function refreshContext(){if(mode==="race")return contextChoices([["ELF","E"],["DWARF","D"],["MAN","M"],["HOBBIT","H"]]);if(mode==="sex")return contextChoices([["MALE","M"],["FEMALE","F"]]);if(mode==="outfit")return outfitMenu();if(mode==="lampdir")return contextChoices([["N","N"],["S","S"],["E","E"],["W","W"]]);if(mode==="retreat")return contextChoices([["N","N"],["S","S"],["E","E"],["W","W"]]);if(mode==="play"&&G){if(G.combat)return combatChoices();let q=room(G.x,G.y,G.z);if(q.c==="V")return contextChoices(G.vendorsAngry?[["ATTACK","A"],["BRIBE","BRIBE"]]:[["TRADE","TRADE"],["ATTACK","A"],["IGNORE","IGNORE"]])}contextChoices([])}
function intro(){clear();out("************************************");out("");out("      * * * THE WIZARD'S CASTLE * * *");out("");out("************************************");out("");
out("MANY CYCLES AGO, IN THE KINGDOM OF N'DIC,");out("THE GNOMIC WIZARD ZOT FORGED HIS GREAT");out("*ORB OF POWER*. HE VANISHED, LEAVING HIS");out("VAST SUBTERRANEAN CASTLE, ITS TREASURES,");out("MONSTERS, AND THE INCREDIBLE ORB OF ZOT.");out("");out("ALL RIGHT, BOLD ONE.");out("");out("TYPE NEW TO BEGIN, OR LOAD TO RESUME.");}

function blankDungeon(){return Array.from({length:8},()=>Array.from({length:8},()=>Array.from({length:8},()=>({c:".",seen:false,monster:0,staff:false,orb:false,curse:0,treasure:-1}))))}
function room(x,y,z){return G.d[z][y][x]}
function emptyOn(z){let a=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(room(x,y,z).c===".")a.push([x,y]);return a}
function place(z,c,extra={}){let a=emptyOn(z); if(!a.length)return null;let [x,y]=a[R(a.length)];Object.assign(room(x,y,z),{c,...extra});return [x,y]}
function generate(){
 G={d:blankDungeon(),x:3,y:0,z:0,turn:0,race:"",sex:"",st:8,dx:8,iq:8,gp:60,hp:20,maxhp:20,
 weapon:0,armor:0,dur:0,lamp:false,flares:0,staff:false,orb:false,treasures:[],curses:[false,false,false],blind:false,book:false,lastDir:"N",vendorsAngry:false,combat:null,lastKill:-999,sex:""};
 room(3,0,0).c="E";room(3,0,0).seen=true;
 for(let z=0;z<7;z++){for(let k=0;k<2;k++){let p=place(z,"D"); if(p){let [x,y]=p;room(x,y,z+1).c="U"}}}
 for(let z=0;z<8;z++){for(let m=1;m<=12;m++)place(z,"M",{monster:m});for(let k=0;k<3;k++)["P","C","G","F","W","S","O","B"].forEach(c=>place(z,c));for(let k=0;k<3;k++)place(z,"V")}
 treasureNames.forEach((_,i)=>place(R(8),"T",{treasure:i}));
 for(let q=1;q<=3;q++){let z=R(8),p=place(z,".",{curse:q});}
 let sz=R(8), sm=R(12)+1; place(sz,"M",{monster:sm,staff:true});
 let oz=R(8);place(oz,"W",{orb:true});
 return G;
}
function newGame(){generate();mode="race";clear();out("YOU MAY BE AN ELF, DWARF, MAN, OR HOBBIT.");out("YOUR CHOICE? (E/D/M/H)");refreshContext();update()}
function racePick(c){let map={H:["HOBBIT",4,12,8,4],E:["ELF",6,10,8,8],M:["MAN",8,8,8,8],D:["DWARF",10,6,8,8]};let a=map[c];if(!a){out("PLEASE CHOOSE E, D, M, OR H.");return}[G.race,G.st,G.dx,G.iq,G.points]=a;mode="sex";out("MALE OR FEMALE? (M/F)");refreshContext()}
function sexPick(c){if(!["M","F"].includes(c)){out("PLEASE CHOOSE M OR F.");return}G.sex=c==="M"?"MALE":"FEMALE";mode="points";out(`YOU HAVE ${G.points} EXTRA POINTS.`);out("ENTER THREE NUMBERS FOR ST DX IQ, E.G. 3 2 3");refreshContext()}
function pointsPick(s){let a=s.trim().split(/\s+/).map(Number);if(a.length!==3||a.some(Number.isNaN)||a.some(n=>n<0)||a.reduce((x,y)=>x+y,0)!==G.points){out(`ALLOCATE EXACTLY ${G.points} POINTS.`);return}G.st+=a[0];G.dx+=a[1];G.iq+=a[2];mode="outfit";outfitMenu()}
function outfitMenu(){out(`GOLD: ${G.gp}. BUY WEAPON, ARMOR, LAMP, OR FLARES.`);out("DAGGER 10, MACE 20, SWORD 30; LEATHER 10, CHAINMAIL 20, PLATE 30; LAMP 20; FLARE 1.");out("TYPE DONE WHEN READY.");contextChoices([["DAGGER","BUY DAGGER"],["MACE","BUY MACE"],["SWORD","BUY SWORD"],["LEATHER","BUY LEATHER"],["CHAINMAIL","BUY CHAINMAIL"],["PLATE","BUY PLATE"],["LAMP","BUY LAMP"],["FLARE","BUY FLARE"],["DONE","DONE"]])}
function outfit(s){s=s.replace(/^BUY\s+/,"").trim();if(s==="DONE"){mode="play";contextChoices([]);out("YOU ENTER THE CASTLE.");beginTurn();describe();save();return}let p=0,a=null;if(s==="DAGGER"){p=10;a=()=>G.weapon=1}else if(s==="MACE"){p=20;a=()=>G.weapon=2}else if(s==="SWORD"){p=30;a=()=>G.weapon=3}else if(s==="LEATHER"){p=10;a=()=>{G.armor=1;G.dur=7}}else if(s==="CHAINMAIL"){p=20;a=()=>{G.armor=2;G.dur=14}}else if(s==="PLATE"){p=30;a=()=>{G.armor=3;G.dur=21}}else if(s==="LAMP"){p=20;a=()=>G.lamp=true}else if(s==="FLARE"){p=1;a=()=>G.flares++}else{out("I DON'T UNDERSTAND THAT PURCHASE.");return}if(G.gp<p){out("YOU DON'T HAVE ENOUGH GOLD.");return}G.gp-=p;a();out("PURCHASED "+s+".");outfitMenu();update()}
function update(){if(!G){status.textContent="NO GAME";return}status.textContent=`L${G.z+1} ST:${G.st} DX:${G.dx} IQ:${G.iq} GP:${G.gp}`}
function map(){if(G.blind){out("YOU CANNOT SEE THE MAP.");return}out("");out(`MAP - LEVEL ${G.z+1}`);out("  1 2 3 4 5 6 7 8");for(let y=0;y<8;y++){let line=(y+1)+" ";for(let x=0;x<8;x++){let r=room(x,y,G.z),c=r.seen?r.c:"?";if(x===G.x&&y===G.y)c="@";line+=c+" "}out(line)}out("")}
function describe(){
 let r=room(G.x,G.y,G.z);r.seen=true;if(!G.blind)out(`YOU ARE AT (${G.x+1},${G.y+1}) ON LEVEL ${G.z+1}.`);else out("YOU CANNOT SEE WHERE YOU ARE.");
 if(r.c==="M"){out(`A ${monsterNames[r.monster-1]} IS HERE.`);if(!G.combat)startCombat(false)}
 else if(r.c==="V"){out(G.vendorsAngry?"AN ANGRY VENDOR BLOCKS YOUR WAY.":"A VENDOR EYES YOUR PURSE. TRADE, ATTACK, OR IGNORE?");if(G.vendorsAngry&&!G.combat)startCombat(true)}
 else {let d={E:"THE CASTLE ENTRANCE IS HERE.",D:"STAIRS LEAD DOWN.",U:"STAIRS LEAD UP.",P:"A STRANGE POOL SHIMMERS HERE.",C:"A CHEST RESTS HERE.",G:"GOLD GLITTERS ON THE FLOOR.",F:"YOU FIND FLARES.",W:"A WARP HUMS HERE.",S:"A SINKHOLE YAWNS HERE.",O:"A CRYSTAL ORB RESTS HERE.",B:"AN ANCIENT BOOK LIES HERE.",T:"A FABULOUS TREASURE IS HERE.",".":"THE ROOM IS EMPTY."};out(d[r.c]||"")}
 resolvePassive(r);refreshContext();update()
}
function resolvePassive(r){
 if(r.c==="G"){let n=roll(10);G.gp+=n;r.c=".";out(`YOU PICK UP ${n} GOLD PIECES.`)}
 if(r.c==="F"){let n=roll(5);G.flares+=n;r.c=".";out(`YOU FIND ${n} FLARES.`)}
 if(r.c==="T"){let n=r.treasure;G.treasures.push(n);r.c=".";out(`YOU HAVE FOUND THE ${treasureNames[n]}!`)}
 if(r.c==="S"){out("YOU FALL THROUGH THE SINKHOLE!");G.z=(G.z+1)%8;describe()}
 if(r.c==="W"&&!r.orb){out("THE WARP TAKES YOU!");G.x=R(8);G.y=R(8);G.z=R(8);describe()}
 if(r.curse){G.curses[r.curse-1]=true;out(["","YOU FEEL A TERRIBLE LETHARGY.","A LEECHING CURSE CLINGS TO YOU.","A FOG OF FORGETFULNESS CLOUDS YOUR MIND."][r.curse])}
}
function hasTreasure(i){return G.treasures.includes(i)}
function dead(){if(G.st<=0||G.dx<=0||G.iq<=0){out("*** YOU HAVE DIED IN THE WIZARD'S CASTLE. ***");mode="dead";G.combat=null;contextChoices([]);localStorage.removeItem("wcastle-save");return true}return false}
function beginTurn(){if(mode!=="play")return;G.turn++;if(!G.staff&&!G.orb){if(G.curses[0]&&!hasTreasure(0))G.turn++;if(G.curses[1]&&!hasTreasure(2))G.gp=Math.max(0,G.gp-roll(5));if(G.curses[2]&&!hasTreasure(4))room(R(8),R(8),R(8)).seen=false}if(G.blind&&hasTreasure(3)){G.blind=false;out("THE OPAL EYE RESTORES YOUR SIGHT.")}if(G.book&&hasTreasure(5)){G.book=false;out("THE BLUE FLAME DISSOLVES THE BOOK FROM YOUR HANDS.")}if(R(5)===0)randomMessage()}
function randomMessage(){let a=G.blind?"YOU STEPPED ON A FROG.":"YOU SEE A BAT FLY BY.";let msgs=[a,"YOU HEAR "+["A SCREAM.","FOOTSTEPS.","A WUMPUS.","THUNDER."][R(4)],"YOU SNEEZED.","YOU STEPPED ON A FROG.","YOU SMELL A "+monsterNames[R(12)]+" FRYING.","YOU FEEL LIKE YOU'RE BEING WATCHED.","YOU ARE PLAYING WIZARD'S CASTLE."];out(msgs[R(msgs.length)])}
function move(dx,dy,dir){if(G.combat){out("YOU ARE IN COMBAT. ATTACK, RETREAT, BRIBE, OR CAST.");return}if(G.z===0&&G.x===3&&G.y===0&&dir==="N"){out(G.orb?"*** YOU ESCAPE WITH THE ORB OF ZOT! YOU WIN! ***":"YOU LEAVE THE CASTLE WITHOUT THE ORB OF ZOT. YOU LOSE.");mode=G.orb?"won":"lost";localStorage.removeItem("wcastle-save");return}G.lastDir=dir;G.x=(G.x+dx+8)%8;G.y=(G.y+dy+8)%8;beginTurn();resolveArrival();save()}
function resolveArrival(){let r=room(G.x,G.y,G.z);if(r.c==="W"&&r.orb){let d={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]}[G.lastDir]||[0,0];G.x=(G.x+d[0]+8)%8;G.y=(G.y+d[1]+8)%8;out("YOU PASS STRAIGHT THROUGH THE STRANGE WARP.");return resolveArrival()}describe()}
function stairs(up){if(G.combat){out("YOU ARE IN COMBAT.");return}let r=room(G.x,G.y,G.z);if(up&&r.c==="U"){G.z--;beginTurn();resolveArrival()}else if(!up&&r.c==="D"){G.z++;beginTurn();resolveArrival()}else out("THERE ARE NO STAIRS THAT WAY.");save()}
function startCombat(vendor){let n=vendor?13:room(G.x,G.y,G.z).monster;G.combat={vendor,n,hp:n+2,web:0,round:1,playerFirst:!(G.blind||(G.curses[0]&&!hasTreasure(0)&&!G.staff&&!G.orb)||G.dx<roll(9)+roll(9))};out("COMBAT BEGINS!");if(!G.combat.playerFirst)monsterAttack();combatChoices()}
function combatChoices(){if(!G.combat)return refreshContext();let a=[["ATTACK","A"],["RETREAT","RETREAT"],["BRIBE","BRIBE"]];if(G.combat.round===1&&G.combat.playerFirst&&G.iq>14)a.push(["WEB","CAST WEB"],["FIREBALL","CAST FIREBALL"],["DEATHSPELL","CAST DEATHSPELL"]);contextChoices(a)}
function damagePlayer(x){let absorb=Math.min(x,G.armor);G.st-=Math.max(0,x-G.armor);G.dur-=absorb;if(G.armor&&G.dur<=0){G.armor=0;G.dur=0;out("YOUR ARMOR IS DESTROYED!")}dead()}
function monsterAttack(){if(!G.combat)return;if(G.combat.web>0){G.combat.web--;if(G.combat.web>0){out("THE MONSTER STRUGGLES IN THE WEB.");return}else out("THE WEB BREAKS!")}let target=roll(7)+roll(7)+roll(7)+(G.blind?3:0);if(G.dx<target){let dmg=1+Math.floor(G.combat.n/2);out("THE "+(G.combat.vendor?"VENDOR":monsterNames[G.combat.n-1])+" HITS FOR "+dmg+".");damagePlayer(dmg)}else out("THE MONSTER MISSES.")}
function attack(){if(!G.combat){let r=room(G.x,G.y,G.z);if(r.c==="V"){G.vendorsAngry=true;startCombat(true)}else if(r.c==="M")startCombat(false);else out("THERE IS NOTHING HERE TO ATTACK.");return}if(!G.weapon||G.book){out(!G.weapon?"YOU HAVE NO WEAPON!":"THE BOOK STUCK TO YOUR HANDS PREVENTS YOUR ATTACK!");monsterAttack();G.combat.round++;combatChoices();return}let hit=G.dx>=roll(20)+(G.blind?3:0);if(hit){G.combat.hp-=G.weapon;out("YOU HIT FOR "+G.weapon+".");if((G.combat.n===9||G.combat.n===12)&&R(8)===0){G.weapon=0;out("YOUR WEAPON BREAKS!")}}else out("YOU MISS.");if(G.combat&&G.combat.hp<=0){winCombat();return}monsterAttack();if(G.combat){G.combat.round++;combatChoices()}save()}
function winCombat(){let q=room(G.x,G.y,G.z),v=G.combat.vendor;if(v){G.weapon=3;G.armor=3;G.dur=21;G.lamp=true;G.st=Math.min(18,G.st+roll(6));G.iq=Math.min(18,G.iq+roll(6));G.dx=Math.min(18,G.dx+roll(6));out("THE VENDOR IS SLAIN. YOU TAKE PLATE ARMOR, A SWORD, THREE POTIONS, AND A LAMP.")}else{let gold=roll(1000);G.gp+=gold;out("THE MONSTER IS SLAIN. YOU FIND "+gold+" GOLD PIECES.");if(q.staff){G.staff=true;out("THE MONSTER CARRIED THE RUNESTAFF!")}if(G.turn-G.lastKill>60){let m=monsterNames[R(12)],s=["WICH"," STEW"," SOUP"," BURGER"," ROAST"," MUNCHY"," TACO"," PIE"][R(8)];out("YOU SPEND AN HOUR EATING "+m+s+".");G.lastKill=G.turn}}q.c=".";q.monster=0;q.staff=false;G.combat=null;contextChoices([]);update();save()}
function retreat(dir){if(!G.combat){out("YOU ARE NOT IN COMBAT.");return}monsterAttack();if(dead())return;let d={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]}[dir];if(!d){mode="retreat";out("RETREAT WHICH WAY? N/S/E/W");refreshContext();return}G.combat=null;mode="play";G.lastDir=dir;G.x=(G.x+d[0]+8)%8;G.y=(G.y+d[1]+8)%8;beginTurn();resolveArrival();save()}
function castSpell(s){if(!G.combat||G.combat.round!==1||!G.combat.playerFirst||G.iq<=14){out("YOU CANNOT CAST A SPELL NOW.");return}s=s.toUpperCase();if(s==="WEB"){G.st--;if(dead())return;G.combat.web=roll(6)+1;out("A WEB ENTANGLES THE MONSTER!")}else if(s==="FIREBALL"){G.st--;G.iq--;if(dead())return;let d=roll(7)+roll(7);G.combat.hp-=d;out("FIREBALL HITS FOR "+d+"!")}else if(s==="DEATHSPELL"){if(G.iq<15+roll(4)){G.st=0;dead();return}else{G.combat.hp=0;out("THE DEATHSPELL STRIKES TRUE!")}}else{return}if(G.combat&&G.combat.hp<=0){winCombat();return}monsterAttack();if(G.combat){G.combat.round++;combatChoices()}save()}
function flare(){if(G.blind){out("YOU CANNOT USE A FLARE WHILE BLIND.");return}if(G.flares<1){out("YOU HAVE NO FLARES.");return}G.flares--;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)room((G.x+xx+8)%8,(G.y+yy+8)%8,G.z).seen=true;out("THE FLARE REVEALS THE NEARBY ROOMS.");beginTurn();map();save()}
function lamp(dir=""){if(G.blind){out("YOU CANNOT USE THE LAMP WHILE BLIND.");return}if(!G.lamp){out("YOU HAVE NO LAMP.");return}if(!dir){mode="lampdir";out("SHINE THE LAMP WHICH WAY? N/S/E/W");refreshContext();return}let d={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]}[dir];room((G.x+d[0]+8)%8,(G.y+d[1]+8)%8,G.z).seen=true;out("THE LAMP REVEALS THE ADJACENT ROOM.");mode="play";beginTurn();refreshContext();save()}
function openThing(){let r=room(G.x,G.y,G.z);if(r.c!=="C"){out("NOTHING HERE OPENS.");return}let q=R(4);if(q===0){let d=roll(6);r.c=".";out("THE CHEST EXPLODES!");damagePlayer(d)}else if(q===1){out("POISON GAS! YOU STUMBLE AWAY.");G.turn+=20;let a=[["N",0,-1],["S",0,1],["E",1,0],["W",-1,0]][R(4)];G.lastDir=a[0];G.x=(G.x+a[1]+8)%8;G.y=(G.y+a[2]+8)%8;beginTurn();resolveArrival()}else{let n=roll(1000);G.gp+=n;r.c=".";out("THE CHEST HOLDS "+n+" GOLD PIECES.")}save()}
function drink(){let r=room(G.x,G.y,G.z);if(r.c!=="P"){out("THERE IS NO POOL HERE.");return}let q=R(8),n=roll(3);if(q===0){G.st=Math.min(18,G.st+n);out("YOU FEEL STRONGER.")}else if(q===1){G.st-=n;out("YOU FEEL WEAKER.")}else if(q===2){G.iq=Math.min(18,G.iq+n);out("YOU FEEL SMARTER.")}else if(q===3){G.iq-=n;out("YOU FEEL DUMBER.")}else if(q===4){G.dx=Math.min(18,G.dx+n);out("YOU FEEL NIMBLER.")}else if(q===5){G.dx-=n;out("YOU FEEL CLUMSIER.")}else if(q===6){let races=["HOBBIT","ELF","MAN","DWARF"].filter(x=>x!==G.race);G.race=races[R(races.length)];out("YOU FEEL VERY STRANGE. YOU ARE NOW A "+G.race+".")}else{G.sex=G.sex==="MALE"?"FEMALE":"MALE";out("YOU FEEL VERY STRANGE. YOUR SEX HAS CHANGED.")}if(G.st<=0||G.iq<=0||G.dx<=0){out("*** YOU HAVE DIED IN THE WIZARD'S CASTLE. ***");mode="dead";localStorage.removeItem("wcastle-save")}tick();update();save()}
function gaze(){let r=room(G.x,G.y,G.z);if(r.c!=="O"){out("THERE IS NO CRYSTAL ORB HERE.");return}if(G.blind){out("YOU CANNOT GAZE INTO THE ORB WHILE BLIND.");return}let q=R(6);if(q===0){let n=roll(2);G.st-=n;r.c=".";out("YOU SEE YOURSELF IN A BLOODY HEAP!");out("THE CRYSTAL ORB GOES DARK AND CRUMBLES.");if(G.st<=0){out("*** YOU HAVE DIED IN THE WIZARD'S CASTLE. ***");mode="dead";localStorage.removeItem("wcastle-save")}}else if(q===1){out("YOU SEE YOURSELF BECOMING A "+monsterNames[R(12)]+".")}else if(q===2){out("A "+monsterNames[R(12)]+" GAZES BACK AT YOU!")}else if(q===3){let z=R(8),x=R(8),y=R(8);room(x,y,z).seen=true;out("YOU SEE SOMETHING AT ("+(x+1)+","+(y+1)+") ON LEVEL "+(z+1)+".")}else if(q===4){let real=Math.random()<3/8,loc=null;if(real){for(let z=0;z<8&&!loc;z++)for(let y=0;y<8&&!loc;y++)for(let x=0;x<8;x++)if(room(x,y,z).orb){loc=[x,y,z];break}}if(!loc)loc=[R(8),R(8),R(8)];out("YOU SEE THE ORB OF ZOT AT ("+(loc[0]+1)+","+(loc[1]+1)+") ON LEVEL "+(loc[2]+1)+".")}else out("YOU SEE A SOAP OPERA RERUN.");tick();update();save()}
function readBook(){let r=room(G.x,G.y,G.z);if(r.c!=="B"){out("THERE IS NO BOOK HERE.");return}let q=R(6);if(q===0){G.blind=true;out("A FLASH FROM THE BOOK BLINDS YOU!")}else if(q===1)out("IT IS A BOOK OF ZOT'S POETRY.") ;else if(q===2)out("IT IS AN OLD COPY OF PLAYMONSTER FEATURING A "+monsterNames[R(12)]+".");else if(q===3){G.dx=18;out("A MANUAL OF DEXTERITY! DX IS NOW 18.")}else if(q===4){G.st=18;out("A MANUAL OF STRENGTH! ST IS NOW 18.")}else{G.book=true;out("THE BOOK STICKS TO YOUR HANDS!")}r.c=".";beginTurn();update();save()}
function teleport(arg){if(!G.staff){out("YOU DO NOT HAVE THE RUNESTAFF.");return}let a=(arg||"").match(/(\d+)\D+(\d+)\D+(\d+)/);if(!a){out("TYPE: T X Y LEVEL (VALUES 1-8)");return}let x=+a[1]-1,y=+a[2]-1,z=+a[3]-1;if([x,y,z].some(v=>v<0||v>7)){out("COORDINATES MUST BE 1 THROUGH 8.");return}G.x=x;G.y=y;G.z=z;let r=room(x,y,z);if(r.orb){G.orb=true;G.staff=false;r.orb=false;r.c=".";out("*** THE RUNESTAFF VANISHES! YOU HAVE THE ORB OF ZOT! ***");beginTurn();describe()}else{out("THE RUNESTAFF BENDS SPACE AROUND YOU.");beginTurn();resolveArrival()}save()}
function trade(arg=""){let q=room(G.x,G.y,G.z);if(q.c!=="V"||G.vendorsAngry){out("NO FRIENDLY VENDOR WILL TRADE WITH YOU.");return}let s=arg.trim().toUpperCase();if(!s){out("BUY: DAGGER 1250, MACE 1500, SWORD 2000.");out("LEATHER 1250, CHAINMAIL 1500, PLATE 2000, LAMP 1000.");out("ST/IQ/DX POTIONS 1000. TYPE SELL TO SELL ALL TREASURE.");contextChoices([["SELL","SELL"],["DAGGER","BUY DAGGER"],["MACE","BUY MACE"],["SWORD","BUY SWORD"],["LEATHER","BUY LEATHER"],["CHAINMAIL","BUY CHAINMAIL"],["PLATE","BUY PLATE"],["LAMP","BUY LAMP"],["ST","BUY ST"],["IQ","BUY IQ"],["DX","BUY DX"],["LEAVE","IGNORE"]]);return}if(s==="SELL"){if(!G.treasures.length){out("YOU HAVE NO TREASURES TO SELL.");return}let total=0;G.treasures.forEach(t=>total+=roll((t+1)*1500));G.treasures=[];G.gp+=total;out("THE VENDOR PAYS "+total+" GP.");update();save();trade();return}if(s.startsWith("BUY "))s=s.slice(4).trim();let p=0,a=null;if(s==="DAGGER"){p=1250;a=()=>G.weapon=1}else if(s==="MACE"){p=1500;a=()=>G.weapon=2}else if(s==="SWORD"){p=2000;a=()=>G.weapon=3}else if(s==="LEATHER"){p=1250;a=()=>{G.armor=1;G.dur=7}}else if(s==="CHAINMAIL"){p=1500;a=()=>{G.armor=2;G.dur=14}}else if(s==="PLATE"){p=2000;a=()=>{G.armor=3;G.dur=21}}else if(s==="LAMP"){p=1000;a=()=>G.lamp=true}else if(["ST","IQ","DX"].includes(s)){p=1000;a=()=>{let k=s.toLowerCase(),n=roll(6);G[k]=Math.min(18,G[k]+n);out(s+" INCREASES BY "+n+".")}}else{out("THE VENDOR DOES NOT SELL THAT.");return}if(G.gp<p){out("YOU NEED "+p+" GP.");return}G.gp-=p;a();out("PURCHASED "+s+" FOR "+p+" GP.");update();save();trade()}
function bribe(){let q=room(G.x,G.y,G.z);if(q.c!=="V"||!G.vendorsAngry){out("THERE IS NO ANGRY VENDOR TO BRIBE.");return}if(!G.treasures.length){out("YOU HAVE NO TREASURE TO OFFER.");return}let t=G.treasures.splice(R(G.treasures.length),1)[0];out("THE VENDOR TAKES YOUR "+treasureNames[t]+".");G.vendorsAngry=false;out("ALL VENDORS ARE FRIENDLY AGAIN.");refreshContext();save()}
function attackVendor(){let q=room(G.x,G.y,G.z);G.vendorsAngry=true;let hp=15;out("YOU ATTACK THE VENDOR! ALL VENDORS ARE NOW HOSTILE.");while(hp>0&&G.hp>0){if(roll(20)+Math.floor(G.dx/3)>=20){let d=Math.max(1,G.weapon+roll(Math.max(1,Math.floor(G.st/4))));hp-=d;out("YOU HIT FOR "+d+".")}else out("YOU MISS.");if(hp>0){let d=Math.max(0,7-G.armor);G.hp-=d;out("THE VENDOR HITS YOU FOR "+d+".")}}if(G.hp<=0){out("*** YOU HAVE DIED IN THE WIZARD'S CASTLE. ***");mode="dead";contextChoices([]);localStorage.removeItem("wcastle-save");update();return}q.c=".";G.weapon=3;G.armor=3;G.dur=21;G.lamp=true;G.st=Math.min(18,G.st+roll(6));G.iq=Math.min(18,G.iq+roll(6));G.dx=Math.min(18,G.dx+roll(6));out("THE VENDOR IS SLAIN. YOU TAKE A SWORD, PLATE ARMOR, A LAMP, AND THREE POTIONS.");tick();refreshContext();update();save()}
function inventory(){out(`RACE: ${G.race} ${G.sex} ST:${G.st} DX:${G.dx} IQ:${G.iq}`);out(`WEAPON: ${["NONE","DAGGER","MACE","SWORD"][G.weapon]} ARMOR: ${["NONE","LEATHER","CHAINMAIL","PLATE"][G.armor]} (${G.dur})`);out(`GP:${G.gp} FLARES:${G.flares} LAMP:${G.lamp?"YES":"NO"} RUNESTAFF:${G.staff?"YES":"NO"} ORB:${G.orb?"YES":"NO"}`);if(G.treasures.length)out("TREASURES: "+G.treasures.map(i=>treasureNames[i]).join(", "));if(G.blind)out("YOU ARE BLIND.");if(G.book)out("A BOOK IS STUCK TO YOUR HANDS.")}
function help(){out("COMMANDS: N S E W, U/P, D/OWN, M/AP, I/NVENTORY,");out("A/TTACK, F/LARE, L/AMP, O/PEN, R/EAD, G/AZE, DR/INK,");out("T X Y LEVEL, TRADE, SELL, BUY ITEM, BRIBE, SAVE, LOAD, NEW.");}
function save(){if(G&&mode==="play")localStorage.setItem("wcastle-save",JSON.stringify({G,mode}));update()}
function load(){let s=localStorage.getItem("wcastle-save");if(!s){out("NO SAVED GAME.");return}let o=JSON.parse(s);G=o.G;if(G.vendorsAngry===undefined)G.vendorsAngry=false;if(G.combat===undefined)G.combat=null;if(G.sex===undefined||!G.sex)G.sex="MALE";mode="play";refreshContext();clear();out("SAVED GAME RESTORED.");describe()}
function command(raw){
 let s=raw.trim().toUpperCase();if(!s)return;
 if(s==="NEW"){newGame();return} if(s==="LOAD"){load();return}
 if(mode==="race"){racePick(s[0]);return}if(mode==="sex"){sexPick(s[0]);return}if(mode==="points"){pointsPick(s);return}if(mode==="outfit"){outfit(s);return}if(mode==="lampdir"){lamp(s[0]);return}if(mode==="retreat"){retreat(s[0]);return}
 if(mode!=="play"){out("TYPE NEW TO START A NEW GAME.");return}
 let c=s.split(/\s+/)[0];
 if(c==="N"||c==="NORTH")move(0,-1,"N");else if(c==="S"||c==="SOUTH")move(0,1,"S");else if(c==="E"||c==="EAST")move(1,0,"E");else if(c==="W"||c==="WEST")move(-1,0,"W");
 else if(c==="U"||c==="UP")stairs(true);else if(c==="D"||c==="DOWN")stairs(false);else if(c==="M"||c==="MAP")map();else if(c==="I"||c==="INVENTORY")inventory();
 else if(c==="A"||c==="ATTACK")attack();else if(c==="RETREAT"||c==="FLEE")retreat(s.slice(c.length).trim()[0]);else if(c==="CAST")castSpell(s.slice(4).trim());else if(c==="F"||c==="FLARE")flare();else if(c==="L"||c==="LAMP")lamp(s.slice(c.length).trim()[0]);else if(c==="O"||c==="OPEN")openThing();
 else if(c==="R"||c==="READ")readBook();else if(c==="G"||c==="GAZE")gaze();else if(c==="DR"||c==="DRINK")drink();else if(c==="T"||c==="TELEPORT")teleport(s.slice(c.length).trim());
 else if(c==="TR"||c==="TRADE")trade(s.slice(c.length).trim());else if(c==="SELL")trade("SELL");else if(c==="BUY")trade(s);else if(c==="BRIBE"){if(G.combat){if(!G.treasures.length){out("YOU HAVE NO TREASURE TO OFFER.");monsterAttack();if(G.combat){G.combat.round++;combatChoices()}}else{let t=G.treasures.splice(R(G.treasures.length),1)[0];out("THE FOE ACCEPTS YOUR "+treasureNames[t]+".");if(G.combat.vendor)G.vendorsAngry=false;G.combat=null;contextChoices([]);save()}}else bribe();}else if(c==="IGNORE"||c==="LEAVE"){out("YOU IGNORE THE VENDOR.");contextChoices([])}else if(c==="H"||c==="HELP"||c==="?")help();else if(c==="SAVE"){save();out("GAME SAVED.")}else out("I DON'T UNDERSTAND THAT COMMAND.");
 update()
}
$("#enter").onclick=()=>{let v=input.value;input.value="";command(v);input.focus()}
input.addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()})
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>command(b.dataset.cmd))
intro();refreshContext();update();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
